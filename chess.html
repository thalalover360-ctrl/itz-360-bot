<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>itz-360 Chess Arena</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
  <style>
    body {
      background: #121316;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      margin: 0;
      padding: 10px;
    }
    h2 { margin: 10px 0 4px; color: #f1c40f; font-size: 1.3rem; }
    #status { margin-bottom: 10px; font-size: 0.95rem; color: #ecf0f1; font-weight: bold; }
    #myBoard { width: 92vw; max-width: 350px; margin: 0 auto; box-shadow: 0 8px 24px rgba(0,0,0,0.6); border-radius: 8px; overflow: hidden; }
    .highlight-move {
      background: radial-gradient(circle, rgba(46, 204, 113, 0.7) 25%, transparent 30%);
    }
    .highlight-capture {
      background: radial-gradient(circle, rgba(231, 76, 60, 0.6) 80%, transparent 85%);
    }
    .controls {
      margin-top: 14px;
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      background: #27ae60;
      color: white;
      border: none;
      padding: 9px 14px;
      font-size: 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    button.mode-btn { background: #34495e; }
    button.mode-btn.active { background: #e67e22; }
    button:active { transform: scale(0.96); }
  </style>
</head>
<body>

  <h2>⚔️ itz-360 Chess Arena ⚔️</h2>
  <div id="status">White's Turn (Your Move)</div>
  <div id="myBoard"></div>

  <div class="controls">
    <button id="btnAi" class="mode-btn active" onclick="setMode('ai')">🤖 Play Bot</button>
    <button id="btnPass" class="mode-btn" onclick="setMode('pass')">👥 2P Pass & Play</button>
  </div>

  <div class="controls">
    <button onclick="resetGame()">🔄 Restart</button>
    <button style="background:#2980b9;" onclick="board.flip()">🔁 Flip</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let board = null;
    let game = new Chess();
    let mode = 'ai'; // 'ai' or 'pass'
    const statusEl = document.getElementById('status');

    function removeHighlights () {
      $('#myBoard .square-55d63').removeClass('highlight-move highlight-capture');
    }

    function showLegalMoves (square) {
      let moves = game.moves({ square: square, verbose: true });
      if (moves.length === 0) return;

      for (let i = 0; i < moves.length; i++) {
        let sqEl = $('#myBoard .square-' + moves[i].to);
        if (moves[i].captured) {
          sqEl.addClass('highlight-capture');
        } else {
          sqEl.addClass('highlight-move');
        }
      }
    }

    function onDragStart (source, piece, position, orientation) {
      if (game.game_over()) return false;

      // In AI mode, player controls white only
      if (mode === 'ai' && (game.turn() === 'b' || piece.search(/^b/) !== -1)) {
        return false;
      }

      if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
          (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
        return false;
      }

      showLegalMoves(source);
    }

    function makeBotMove () {
      let moves = game.moves();
      if (moves.length === 0) return;
      
      // Random move for quick response
      let move = moves[Math.floor(Math.random() * moves.length)];
      game.move(move);
      board.position(game.fen());
      removeHighlights();
      updateStatus();
    }

    function onDrop (source, target) {
      removeHighlights();

      let move = game.move({
        from: source,
        to: target,
        promotion: 'q'
      });

      if (move === null) return 'snapback';

      updateStatus();

      if (mode === 'ai' && !game.game_over()) {
        statusEl.innerHTML = "🤖 Bot is thinking...";
        window.setTimeout(makeBotMove, 400);
      }
    }

    function onSnapEnd () {
      board.position(game.fen());
    }

    function updateStatus () {
      let status = '';
      let moveColor = game.turn() === 'b' ? 'Black' : 'White';

      if (game.in_checkmate()) {
        status = '🏆 Checkmate! ' + (game.turn() === 'b' ? 'White' : 'Black') + ' wins!';
      } else if (game.in_draw()) {
        status = '🤝 Draw Game!';
      } else {
        status = moveColor + "'s Turn";
        if (game.in_check()) status += ' (⚠️ Check!)';
      }
      statusEl.innerHTML = status;
    }

    function resetGame() {
      game.reset();
      board.start();
      removeHighlights();
      updateStatus();
    }

    function setMode(newMode) {
      mode = newMode;
      document.getElementById('btnAi').classList.toggle('active', mode === 'ai');
      document.getElementById('btnPass').classList.toggle('active', mode === 'pass');
      resetGame();
    }

    const config = {
      draggable: true,
      position: 'start',
      onDragStart: onDragStart,
      onDrop: onDrop,
      onSnapEnd: onSnapEnd,
      pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    };
    board = Chessboard('myBoard', config);
    updateStatus();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>itz-360 Chess Arena</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
  <style>
    body {
      background: #18191c;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
    }
    h2 { margin-bottom: 5px; color: #f1c40f; font-size: 1.4rem; }
    #status { margin-bottom: 12px; font-size: 0.95rem; color: #bdc3c7; }
    #myBoard { width: 92vw; max-width: 360px; margin: 0 auto; box-shadow: 0 8px 24px rgba(0,0,0,0.5); border-radius: 6px; overflow: hidden; }
    .btn-container { margin-top: 15px; display: flex; gap: 10px; }
    button {
      background: #27ae60;
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 0.95rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    button:active { transform: scale(0.97); }
    button.flip { background: #2980b9; }
  </style>
</head>
<body>

  <h2>⚔️ itz-360 Chess Arena ⚔️</h2>
  <div id="status">White to move</div>
  <div id="myBoard"></div>

  <div class="btn-container">
    <button onclick="resetGame()">🔄 New Game</button>
    <button class="flip" onclick="board.flip()">🔁 Flip Board</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let board = null;
    let game = new Chess();
    const statusEl = document.getElementById('status');

    function onDragStart (source, piece, position, orientation) {
      if (game.game_over()) return false;
      if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
          (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
        return false;
      }
    }

    function onDrop (source, target) {
      let move = game.move({
        from: source,
        to: target,
        promotion: 'q'
      });

      if (move === null) return 'snapback';
      updateStatus();
    }

    function onSnapEnd () {
      board.position(game.fen());
    }

    function updateStatus () {
      let status = '';
      let moveColor = game.turn() === 'b' ? 'Black' : 'White';

      if (game.in_checkmate()) {
        status = '🏆 Game over, ' + moveColor + ' is in checkmate!';
      } else if (game.in_draw()) {
        status = '🤝 Game over, drawn position';
      } else {
        status = moveColor + ' to move';
        if (game.in_check()) {
          status += ' (⚠️ Check!)';
        }
      }
      statusEl.innerHTML = status;
    }

    function resetGame() {
      game.reset();
      board.start();
      updateStatus();
    }

    const config = {
      draggable: true,
      position: 'start',
      onDragStart: onDragStart,
      onDrop: onDrop,
      onSnapEnd: onSnapEnd,
      pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    };
    board = Chessboard('myBoard', config);
    updateStatus();
  </script>
</body>
</html>

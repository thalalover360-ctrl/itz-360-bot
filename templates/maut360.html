<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MAUT 360 Action Fighter</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #0b0c10; color: #fff; font-family: sans-serif; overflow: hidden; touch-action: none; }
  #header { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; background: #1f2833; font-weight: bold; font-size: 13px; }
  .bar-box { width: 38%; background: #333; height: 14px; border-radius: 7px; overflow: hidden; border: 1px solid #555; }
  .bar-fill { height: 100%; width: 100%; transition: width 0.1s; }
  #p-bar { background: linear-gradient(90deg, #45f3ff, #00ff88); }
  #e-bar { background: linear-gradient(90deg, #ff0844, #ffb199); }
  #gameCanvas { display: block; width: 100vw; height: calc(100vh - 190px); background: radial-gradient(circle, #1a1c29 0%, #08090d 100%); }
  #controls { display: flex; justify-content: space-between; height: 140px; padding: 10px 14px; background: #12131a; }
  .d-pad, .actions { display: grid; grid-gap: 8px; align-content: center; }
  .d-pad { grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(2, 48px); }
  .actions { grid-template-columns: repeat(2, 54px); grid-template-rows: repeat(2, 48px); }
  .btn { background: #1f2833; border: 2px solid #45f3ff; color: #fff; font-weight: bold; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; box-shadow: 0 4px #0b0c10; }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px #0b0c10; background: #45f3ff; color: #000; }
  .btn-atk { border-color: #ff0844; }
  .btn-atk:active { background: #ff0844; }
  .btn-fly { border-color: #f1c40f; }
  .btn-fly:active { background: #f1c40f; }
</style>
</head>
<body>
  <div id="header">
    <div style="width: 40%;">
      <div>PLAYER 🥊</div>
      <div class="bar-box"><div id="p-bar" class="bar-fill"></div></div>
    </div>
    <div id="stage-text" style="color: #f1c40f;">STAGE 1</div>
    <div style="width: 40%; text-align: right;">
      <div>BOSS 💀</div>
      <div class="bar-box" style="margin-left:auto;"><div id="e-bar" class="bar-fill"></div></div>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div id="controls">
    <div class="d-pad">
      <div></div>
      <button class="btn btn-fly" id="b-fly">🚀</button>
      <div></div>
      <button class="btn" id="b-left">◀</button>
      <button class="btn" id="b-down">▼</button>
      <button class="btn" id="b-right">▶</button>
    </div>
    <div class="actions">
      <button class="btn btn-atk" id="b-punch">👊</button>
      <button class="btn btn-atk" id="b-kick">🦵</button>
      <button class="btn" style="border-color:#a29bfe;" id="b-blast">⚡</button>
      <button class="btn btn-fly" id="b-jump">⬆</button>
    </div>
  </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}
window.addEventListener("resize", resize);
resize();

let stage = 1;
const floorY = () => canvas.height - 40;

const player = {
  x: 50, y: 150, vx: 0, vy: 0, w: 28, h: 50,
  hp: 100, maxHp: 100, isFlying: false, attack: null, timer: 0
};

const enemy = {
  x: 240, y: 150, vx: 0, vy: 0, w: 32, h: 54,
  hp: 100, maxHp: 100, attack: null, timer: 0
};

let projectiles = [];
const keys = {};

function bindBtn(id, pressFn, releaseFn) {
  const el = document.getElementById(id);
  const start = (e) => { e.preventDefault(); pressFn(); };
  const end = (e) => { e.preventDefault(); if(releaseFn) releaseFn(); };
  el.addEventListener("touchstart", start);
  el.addEventListener("touchend", end);
  el.addEventListener("mousedown", start);
  el.addEventListener("mouseup", end);
}

bindBtn("b-left", () => keys.left = true, () => keys.left = false);
bindBtn("b-right", () => keys.right = true, () => keys.right = false);
bindBtn("b-down", () => keys.down = true, () => keys.down = false);
bindBtn("b-jump", () => { if (player.y >= floorY() - player.h - 2) player.vy = -11; });
bindBtn("b-fly", () => {
  player.isFlying = !player.isFlying;
  if (player.isFlying) player.vy = -4;
});

bindBtn("b-punch", () => doAttack("punch"));
bindBtn("b-kick", () => doAttack("kick"));
bindBtn("b-blast", () => spawnBlast());

function doAttack(type) {
  if (player.attack) return;
  player.attack = type;
  player.timer = 15;
  // Hit check
  const dist = Math.abs((player.x + player.w/2) - (enemy.x + enemy.w/2));
  const vDist = Math.abs(player.y - enemy.y);
  if (dist < 55 && vDist < 40) {
    const dmg = type === "punch" ? 12 : 18;
    enemy.hp -= dmg;
    enemy.vx = 8;
  }
}

function spawnBlast() {
  projectiles.push({
    x: player.x + player.w + 4,
    y: player.y + 16,
    vx: 8,
    owner: "p"
  });
}

function updateAI() {
  const dx = player.x - enemy.x;
  if (Math.abs(dx) > 40) {
    enemy.x += dx > 0 ? 1.5 : -1.5;
  } else {
    if (Math.random() < 0.04) {
      player.hp -= 8;
      player.vx = -6;
    }
  }
  // Enemy floor physics
  if (enemy.y + enemy.h < floorY()) enemy.y += 4;
  else enemy.y = floorY() - enemy.h;
  enemy.x += enemy.vx;
  enemy.vx *= 0.8;
}

function loop() {
  // Player Movement
  if (keys.left) player.vx = -4.5;
  else if (keys.right) player.vx = 4.5;
  else player.vx *= 0.7;

  if (player.isFlying) {
    if (keys.down) player.vy = 4;
    else player.vy = Math.sin(Date.now() / 200) * 0.8;
  } else {
    player.vy += 0.6; // Gravity
  }

  player.x += player.vx;
  player.y += player.vy;

  // Floor collision
  if (player.y + player.h >= floorY()) {
    player.y = floorY() - player.h;
    player.vy = 0;
    player.isFlying = false;
  }
  if (player.y < 10) player.y = 10;
  if (player.x < 10) player.x = 10;
  if (player.x > canvas.width - player.w - 10) player.x = canvas.width - player.w - 10;

  if (player.timer > 0) player.timer--;
  else player.attack = null;

  // Projectiles
  for (let i = projectiles.length - 1; i >= 0; i--) {
    let p = projectiles[i];
    p.x += p.vx;
    if (Math.abs(p.x - enemy.x) < 25 && Math.abs(p.y - enemy.y) < 40) {
      enemy.hp -= 22;
      projectiles.splice(i, 1);
      continue;
    }
    if (p.x > canvas.width || p.x < 0) projectiles.splice(i, 1);
  }

  updateAI();

  // Next stage check
  if (enemy.hp <= 0) {
    stage++;
    document.getElementById("stage-text").innerText = `STAGE ${stage}`;
    enemy.hp = 100 + stage * 15;
    enemy.maxHp = enemy.hp;
    enemy.x = canvas.width - 60;
    player.hp = Math.min(player.maxHp, player.hp + 30);
  }

  if (player.hp <= 0) {
    player.hp = player.maxHp;
    stage = 1;
    document.getElementById("stage-text").innerText = "STAGE 1";
  }

  // Update UI Bars
  document.getElementById("p-bar").style.width = Math.max(0, (player.hp / player.maxHp) * 100) + "%";
  document.getElementById("e-bar").style.width = Math.max(0, (enemy.hp / enemy.maxHp) * 100) + "%";

  // DRAW
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Ground
  ctx.fillStyle = "#1f2833";
  ctx.fillRect(0, floorY(), canvas.width, canvas.height - floorY());
  ctx.strokeStyle = "#45f3ff";
  ctx.strokeRect(0, floorY(), canvas.width, 1);

  // Draw Player
  ctx.fillStyle = player.isFlying ? "#f1c40f" : "#00f2fe";
  ctx.fillRect(player.x, player.y, player.w, player.h);
  // Player eyes/head
  ctx.fillStyle = "#fff";
  ctx.fillRect(player.x + (player.w - 8), player.y + 6, 6, 6);
  if (player.attack) {
    ctx.fillStyle = "#ff0844";
    ctx.fillRect(player.x + player.w, player.y + 14, 14, 8);
  }

  // Draw Enemy
  ctx.fillStyle = "#ff416c";
  ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);
  ctx.fillStyle = "#fff";
  ctx.fillRect(enemy.x + 2, enemy.y + 6, 6, 6);

  // Draw Blasts
  ctx.fillStyle = "#a29bfe";
  projectiles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
    ctx.fill();
  });

  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>

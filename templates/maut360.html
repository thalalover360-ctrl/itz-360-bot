<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MAUT 360 Cyber Arena</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #05050a; color: #fff; font-family: 'Courier New', Courier, monospace; overflow: hidden; touch-action: none; }
  
  #hud {
    position: absolute; top: 0; left: 0; width: 100vw; height: 75px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 15px; background: rgba(5, 5, 12, 0.85); backdrop-filter: blur(4px);
    border-bottom: 2px solid #00f2fe; z-index: 10;
  }
  .bar-container { width: 130px; }
  .name-tag { font-size: 11px; font-weight: 900; letter-spacing: 1px; margin-bottom: 4px; text-transform: uppercase; }
  .hp-bg { width: 100%; height: 14px; background: #1a1a24; border: 1.5px solid #fff; border-radius: 4px; overflow: hidden; }
  .hp-fill { height: 100%; width: 100%; transition: width 0.15s ease-out; }
  #p-hp { background: linear-gradient(90deg, #00f2fe, #4facfe); box-shadow: 0 0 10px #00f2fe; }
  #e-hp { background: linear-gradient(90deg, #ff0844, #ff4b2b); box-shadow: 0 0 10px #ff0844; }

  #center-badge { text-align: center; }
  #vs-text { font-size: 18px; font-weight: 900; color: #ffeb3b; text-shadow: 0 0 10px #ffeb3b; }
  #combo-counter { font-size: 12px; color: #00f2fe; font-weight: bold; min-height: 14px; }

  #gameCanvas { display: block; width: 100vw; height: calc(100vh - 170px); margin-top: 75px; background: #000; }

  #controls {
    position: absolute; bottom: 0; left: 0; width: 100vw; height: 170px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 18px; background: #080911; border-top: 2px solid #1a1c2e; z-index: 10;
  }
  .d-pad { display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(2, 48px); gap: 6px; }
  .action-pad { display: grid; grid-template-columns: repeat(2, 58px); grid-template-rows: repeat(2, 48px); gap: 8px; }
  .ctrl-btn {
    background: #121422; border: 2px solid #272c47; color: #fff; font-size: 17px;
    font-weight: 900; border-radius: 12px; display: flex; align-items: center; justify-content: center;
  }
  .ctrl-btn:active { transform: scale(0.92); background: #3b436d; }
  .btn-slash { border-color: #00f2fe; color: #00f2fe; box-shadow: inset 0 0 8px rgba(0,242,254,0.3); }
  .btn-smash { border-color: #ff0844; color: #ff0844; box-shadow: inset 0 0 8px rgba(255,8,68,0.3); }
  .btn-surge { border-color: #ffd200; color: #ffd200; }
  .btn-jump { border-color: #a8ff78; color: #a8ff78; }
</style>
</head>
<body>

  <div id="hud">
    <div class="bar-container">
      <div class="name-tag" style="color: #00f2fe;">CYBER BLADE</div>
      <div class="hp-bg"><div id="p-hp" class="hp-fill"></div></div>
    </div>
    <div id="center-badge">
      <div id="vs-text">VS</div>
      <div id="combo-counter"></div>
    </div>
    <div class="bar-container" style="text-align: right;">
      <div class="name-tag" style="color: #ff0844;">MECHA WARLORD</div>
      <div class="hp-bg"><div id="e-hp" class="hp-fill"></div></div>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div id="controls">
    <div class="d-pad">
      <div></div>
      <button class="ctrl-btn btn-surge" id="b-surge">⚡</button>
      <div></div>
      <button class="ctrl-btn" id="b-left">◀</button>
      <button class="ctrl-btn" id="b-down">▼</button>
      <button class="ctrl-btn" id="b-right">▶</button>
    </div>
    <div class="action-pad">
      <button class="ctrl-btn btn-slash" id="b-slash">🗡️</button>
      <button class="ctrl-btn btn-smash" id="b-smash">💥</button>
      <button class="ctrl-btn btn-jump" id="b-jump">⬆</button>
      <button class="ctrl-btn btn-surge" id="b-aura">🔥</button>
    </div>
  </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight - 245;
}
window.addEventListener("resize", resize);
resize();

const groundY = () => canvas.height - 30;
let shakeTime = 0;
let combo = 0;
let comboReset = 0;

const p = { x: 70, y: 100, vx: 0, vy: 0, w: 36, h: 70, hp: 100, maxHp: 100, act: "idle", actT: 0, face: 1, aura: false };
const boss = { x: canvas.width - 100, y: 100, vx: 0, vy: 0, w: 42, h: 80, hp: 100, maxHp: 100, act: "idle", actT: 0, face: -1 };

const slashes = [];
const particles = [];
const keys = {};

function addBtn(id, downFn, upFn) {
  const el = document.getElementById(id);
  const press = (e) => { e.preventDefault(); downFn(); };
  const release = (e) => { e.preventDefault(); if(upFn) upFn(); };
  el.addEventListener("touchstart", press);
  el.addEventListener("touchend", release);
  el.addEventListener("mousedown", press);
  el.addEventListener("mouseup", release);
}

addBtn("b-left", () => keys.left = true, () => keys.left = false);
addBtn("b-right", () => keys.right = true, () => keys.right = false);
addBtn("b-down", () => keys.down = true, () => keys.down = false);
addBtn("b-jump", () => { if (p.y >= groundY() - p.h - 4) p.vy = -14; });
addBtn("b-surge", () => { p.vx = p.face * 14; addSparks(p.x, p.y + 40, "#00f2fe", 12); });
addBtn("b-aura", () => { p.aura = !p.aura; });

addBtn("b-slash", () => triggerStrike("slash", 18, 14));
addBtn("b-smash", () => triggerStrike("smash", 28, 20));

function triggerStrike(type, dmg, duration) {
  if (p.actT > 0) return;
  p.act = type;
  p.actT = duration;

  const hitRange = type === "slash" ? 75 : 90;
  if (Math.abs(p.x - boss.x) < hitRange && Math.abs(p.y - boss.y) < 55) {
    boss.hp -= dmg * (p.aura ? 1.5 : 1);
    boss.vx = p.face * 8;
    shakeTime = 8;
    combo++;
    comboReset = 90;
    document.getElementById("combo-counter").innerText = `${combo}x COMBO!`;
    addSparks(boss.x, boss.y + 35, "#ff0844", 15);
  }
}

function addSparks(x, y, color, count=8) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 8,
      life: 20, color, size: Math.random() * 4 + 2
    });
  }
}

function drawCityBg() {
  ctx.fillStyle = "#0c0d18";
  for (let i = 0; i < canvas.width; i += 45) {
    let bh = 70 + (Math.sin(i) * 30 + 40);
    ctx.fillRect(i, groundY() - bh, 38, bh);
    ctx.fillStyle = "rgba(0, 242, 254, 0.15)";
    ctx.fillRect(i + 8, groundY() - bh + 15, 6, 8);
    ctx.fillRect(i + 22, groundY() - bh + 35, 6, 8);
    ctx.fillStyle = "#0c0d18";
  }
  ctx.fillStyle = "#181a2e";
  ctx.fillRect(0, groundY(), canvas.width, canvas.height - groundY());
  ctx.strokeStyle = "#00f2fe";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, groundY()); ctx.lineTo(canvas.width, groundY());
  ctx.stroke();
}

function drawWarrior(obj, color, isBoss) {
  ctx.save();
  ctx.translate(obj.x, obj.y);

  if (obj.aura) {
    ctx.shadowColor = "#ffd200";
    ctx.shadowBlur = 20;
  }

  // Aura Flames
  if (obj.aura) {
    ctx.strokeStyle = "#ffd200";
    ctx.lineWidth = 2;
    ctx.strokeRect(-obj.w/2 - 4, -4, obj.w + 8, obj.h + 8);
  }

  // Armor Body
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 12;

  // Head / Helmet
  ctx.fillRect(-10, 0, 20, 16);
  ctx.fillStyle = "#fff";
  // Visor
  ctx.fillRect(obj.face === 1 ? 2 : -8, 5, 8, 3);

  // Chest / Armor
  ctx.fillStyle = isBoss ? "#8a0c28" : "#0d5573";
  ctx.fillRect(-12, 18, 24, 28);

  // Cape/Scarf
  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-obj.face * 8, 18);
  ctx.lineTo(-obj.face * 26 + Math.sin(Date.now() / 90) * 4, 34);
  ctx.stroke();

  // Legs
  ctx.fillStyle = "#222";
  ctx.fillRect(-10, 46, 8, 24);
  ctx.fillRect(2, 46, 8, 24);

  // Sword Attack Frame
  if (obj.act === "slash") {
    ctx.strokeStyle = "#fff";
    ctx.shadowColor = "#00f2fe";
    ctx.shadowBlur = 15;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(obj.face * 15, 25, 40, -0.6 * Math.PI, 0.4 * Math.PI, obj.face === -1);
    ctx.stroke();
  } else if (obj.act === "smash") {
    ctx.fillStyle = "#ffeb3b";
    ctx.shadowColor = "#ff0844";
    ctx.shadowBlur = 20;
    ctx.fillRect(obj.face * 18, 10, 25, 25);
  }

  ctx.restore();
}

function loop() {
  if (keys.left) { p.vx = -5; p.face = -1; }
  else if (keys.right) { p.vx = 5; p.face = 1; }
  else p.vx *= 0.75;

  p.vy += 0.7;
  p.x += p.vx; p.y += p.vy;

  if (p.y + p.h >= groundY()) { p.y = groundY() - p.h; p.vy = 0; }
  if (p.x < 25) p.x = 25;
  if (p.x > canvas.width - 25) p.x = canvas.width - 25;

  if (p.actT > 0) p.actT--;
  else p.act = "idle";

  // Boss AI
  const dist = p.x - boss.x;
  boss.face = dist > 0 ? 1 : -1;
  if (Math.abs(dist) > 65) {
    boss.x += boss.face * 2.2;
  } else {
    if (Math.random() < 0.04) {
      boss.act = "smash";
      boss.actT = 15;
      p.hp -= 12;
      p.vx = -boss.face * 7;
      shakeTime = 6;
      addSparks(p.x, p.y + 30, "#00f2fe", 12);
    }
  }
  if (boss.y + boss.h < groundY()) boss.y += 4;
  else boss.y = groundY() - boss.h;

  if (comboReset > 0) comboReset--;
  else { combo = 0; document.getElementById("combo-counter").innerText = ""; }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    let pt = particles[i];
    pt.x += pt.vx; pt.y += pt.vy; pt.life--;
    if (pt.life <= 0) particles.splice(i, 1);
  }

  // Reset Boss when defeated
  if (boss.hp <= 0) {
    boss.hp = 120;
    boss.x = canvas.width - 50;
    p.hp = Math.min(100, p.hp + 40);
  }

  // Update UI HP
  document.getElementById("p-hp").style.width = Math.max(0, (p.hp / p.maxHp) * 100) + "%";
  document.getElementById("e-hp").style.width = Math.max(0, (boss.hp / boss.maxHp) * 100) + "%";

  // Render
  ctx.save();
  if (shakeTime > 0) {
    ctx.translate((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
    shakeTime--;
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawCityBg();
  drawWarrior(p, "#00f2fe", false);
  drawWarrior(boss, "#ff0844", true);

  // Sparks
  particles.forEach(pt => {
    ctx.fillStyle = pt.color;
    ctx.shadowColor = pt.color;
    ctx.shadowBlur = 8;
    ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
  });

  ctx.restore();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>

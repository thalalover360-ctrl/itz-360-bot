<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MAUT 360 Action Fighter</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #0a0b10; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; touch-action: none; }
  #header { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #13141f; border-bottom: 2px solid #232738; }
  .fighter-label { font-size: 13px; font-weight: 800; letter-spacing: 1px; margin-bottom: 4px; }
  .bar-box { width: 140px; background: #222; height: 12px; border-radius: 6px; overflow: hidden; border: 1px solid #444; }
  .bar-fill { height: 100%; width: 100%; transition: width 0.15s ease-out; }
  #p-bar { background: linear-gradient(90deg, #00f2fe, #4facfe); box-shadow: 0 0 8px #00f2fe; }
  #e-bar { background: linear-gradient(90deg, #ff0844, #ffb199); box-shadow: 0 0 8px #ff0844; }
  #stage-badge { font-size: 14px; font-weight: 900; color: #f1c40f; text-shadow: 0 0 8px rgba(241,196,15,0.6); }
  #gameCanvas { display: block; width: 100vw; height: calc(100vh - 195px); background: linear-gradient(180deg, #0f111a 0%, #171a29 100%); }
  #controls { display: flex; justify-content: space-between; height: 135px; padding: 8px 16px; background: #0c0d14; border-top: 1px solid #1f2333; }
  .d-pad { display: grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(2, 46px); gap: 6px; }
  .actions { display: grid; grid-template-columns: repeat(2, 54px); grid-template-rows: repeat(2, 46px); gap: 6px; }
  .btn { background: #181b28; border: 1.5px solid #2e344d; color: #fff; font-weight: bold; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .btn:active { transform: scale(0.92); background: #3a4263; }
  .btn-atk { border-color: #ff0844; color: #ff5277; }
  .btn-atk:active { background: #ff0844; color: #fff; }
  .btn-fly { border-color: #f1c40f; color: #f1c40f; }
  .btn-fly:active { background: #f1c40f; color: #000; }
  .btn-ki { border-color: #00f2fe; color: #00f2fe; }
  .btn-ki:active { background: #00f2fe; color: #000; }
</style>
</head>
<body>
  <div id="header">
    <div>
      <div class="fighter-label" style="color: #00f2fe;">SHADOW NINJA</div>
      <div class="bar-box"><div id="p-bar" class="bar-fill"></div></div>
    </div>
    <div id="stage-badge">STAGE 1</div>
    <div style="text-align: right;">
      <div class="fighter-label" style="color: #ff0844;">DEMON BOSS</div>
      <div class="bar-box"><div id="e-bar" class="bar-fill"></div></div>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div id="controls">
    <div class="d-pad">
      <div></div>
      <button class="btn btn-fly" id="b-fly">🚀</button>
      <div></div>
      <button class="btn" id="b-left">◀</button>
      <button class="btn" id="b-down">▼</button>
      <button class="btn" id="b-right">▶</button>
    </div>
    <div class="actions">
      <button class="btn btn-atk" id="b-punch">👊</button>
      <button class="btn btn-atk" id="b-kick">🦵</button>
      <button class="btn btn-ki" id="b-blast">⚡</button>
      <button class="btn btn-fly" id="b-jump">⬆</button>
    </div>
  </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}
window.addEventListener("resize", resize);
resize();

let stage = 1;
const floorY = () => canvas.height - 35;

const player = {
  x: 60, y: 150, vx: 0, vy: 0, w: 30, h: 65,
  hp: 100, maxHp: 100, isFlying: false, attack: null, timer: 0, facing: 1
};

const enemy = {
  x: 260, y: 150, vx: 0, vy: 0, w: 30, h: 65,
  hp: 100, maxHp: 100, attack: null, timer: 0, facing: -1
};

let projectiles = [];
let particles = [];
const keys = {};

function bindBtn(id, pressFn, releaseFn) {
  const el = document.getElementById(id);
  const s = (e) => { e.preventDefault(); pressFn(); };
  const end = (e) => { e.preventDefault(); if(releaseFn) releaseFn(); };
  el.addEventListener("touchstart", s);
  el.addEventListener("touchend", end);
  el.addEventListener("mousedown", s);
  el.addEventListener("mouseup", end);
}

bindBtn("b-left", () => keys.left = true, () => keys.left = false);
bindBtn("b-right", () => keys.right = true, () => keys.right = false);
bindBtn("b-down", () => keys.down = true, () => keys.down = false);
bindBtn("b-jump", () => { if (player.y >= floorY() - player.h - 2) player.vy = -12; });
bindBtn("b-fly", () => {
  player.isFlying = !player.isFlying;
  if (player.isFlying) player.vy = -5;
});

bindBtn("b-punch", () => doAttack("punch"));
bindBtn("b-kick", () => doAttack("kick"));
bindBtn("b-blast", () => spawnBlast());

function doAttack(type) {
  if (player.attack) return;
  player.attack = type;
  player.timer = 16;
  const dist = Math.abs(player.x - enemy.x);
  const vDist = Math.abs(player.y - enemy.y);
  if (dist < 60 && vDist < 45) {
    const dmg = type === "punch" ? 15 : 22;
    enemy.hp -= dmg;
    enemy.vx = 8;
    addSparks(enemy.x, enemy.y + 25, "#ff0844");
  }
}

function spawnBlast() {
  projectiles.push({ x: player.x + 20, y: player.y + 20, vx: 9, r: 8, color: "#00f2fe" });
}

function addSparks(x, y, color) {
  for (let i = 0; i < 7; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6,
      life: 18, color
    });
  }
}

function drawHumanoid(char, color, isBoss) {
  const headR = 10;
  const cx = char.x;
  const cy = char.y;

  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 4;
  ctx.lineCap = "round";

  // Glow
  ctx.shadowColor = color;
  ctx.shadowBlur = 10;

  // Head
  ctx.beginPath();
  ctx.arc(cx, cy + headR, headR, 0, Math.PI * 2);
  ctx.fill();

  // Ninja headband / Horns
  if (isBoss) {
    ctx.strokeStyle = "#ff0844";
    ctx.beginPath();
    ctx.moveTo(cx - 7, cy + 3); ctx.lineTo(cx - 12, cy - 6);
    ctx.moveTo(cx + 7, cy + 3); ctx.lineTo(cx + 12, cy - 6);
    ctx.stroke();
  }

  // Torso
  ctx.beginPath();
  ctx.moveTo(cx, cy + headR * 2);
  ctx.lineTo(cx, cy + 38);
  ctx.stroke();

  // Arms & Attack Pose
  ctx.beginPath();
  if (char.attack === "punch") {
    ctx.moveTo(cx, cy + 24);
    ctx.lineTo(cx + (char.facing * 28), cy + 24);
  } else {
    ctx.moveTo(cx, cy + 24);
    ctx.lineTo(cx - (char.facing * 12), cy + 30);
    ctx.moveTo(cx, cy + 24);
    ctx.lineTo(cx + (char.facing * 12), cy + 30);
  }
  ctx.stroke();

  // Legs & Kick Pose
  ctx.beginPath();
  if (char.attack === "kick") {
    ctx.moveTo(cx, cy + 38);
    ctx.lineTo(cx + (char.facing * 30), cy + 32);
    ctx.moveTo(cx, cy + 38);
    ctx.lineTo(cx - 5, cy + 62);
  } else {
    ctx.moveTo(cx, cy + 38);
    ctx.lineTo(cx - 9, cy + 62);
    ctx.moveTo(cx, cy + 38);
    ctx.lineTo(cx + 9, cy + 62);
  }
  ctx.stroke();

  // Flying flame aura
  if (char.isFlying) {
    ctx.strokeStyle = "#f1c40f";
    ctx.beginPath();
    ctx.moveTo(cx - 6, cy + 64);
    ctx.lineTo(cx, cy + 74 + Math.random() * 6);
    ctx.lineTo(cx + 6, cy + 64);
    ctx.stroke();
  }

  ctx.restore();
}

function update() {
  if (keys.left) { player.vx = -4.5; player.facing = -1; }
  else if (keys.right) { player.vx = 4.5; player.facing = 1; }
  else player.vx *= 0.7;

  if (player.isFlying) {
    if (keys.down) player.vy = 4;
    else player.vy = Math.sin(Date.now() / 180) * 0.9;
  } else {
    player.vy += 0.6;
  }

  player.x += player.vx;
  player.y += player.vy;

  if (player.y + player.h >= floorY()) {
    player.y = floorY() - player.h;
    player.vy = 0;
    player.isFlying = false;
  }
  if (player.y < 20) player.y = 20;
  if (player.x < 20) player.x = 20;
  if (player.x > canvas.width - 20) player.x = canvas.width - 20;

  if (player.timer > 0) player.timer--;
  else player.attack = null;

  // AI Boss Update
  const dx = player.x - enemy.x;
  enemy.facing = dx > 0 ? 1 : -1;
  if (Math.abs(dx) > 48) {
    enemy.x += dx > 0 ? 1.6 : -1.6;
  } else {
    if (Math.random() < 0.035) {
      player.hp -= 9;
      player.vx = -5;
      addSparks(player.x, player.y + 25, "#00f2fe");
    }
  }
  if (enemy.y + enemy.h < floorY()) enemy.y += 4;
  else enemy.y = floorY() - enemy.h;
  enemy.x += enemy.vx;
  enemy.vx *= 0.8;

  // Projectiles
  for (let i = projectiles.length - 1; i >= 0; i--) {
    let p = projectiles[i];
    p.x += p.vx;
    if (Math.abs(p.x - enemy.x) < 25 && Math.abs(p.y - enemy.y) < 40) {
      enemy.hp -= 20;
      addSparks(p.x, p.y, "#00f2fe");
      projectiles.splice(i, 1);
      continue;
    }
    if (p.x > canvas.width || p.x < 0) projectiles.splice(i, 1);
  }

  // Sparks
  for (let i = particles.length - 1; i >= 0; i--) {
    let pt = particles[i];
    pt.x += pt.vx; pt.y += pt.vy; pt.life--;
    if (pt.life <= 0) particles.splice(i, 1);
  }

  // Next Stage / Reset
  if (enemy.hp <= 0) {
    stage++;
    document.getElementById("stage-badge").innerText = `STAGE ${stage}`;
    enemy.hp = 100 + stage * 20;
    enemy.maxHp = enemy.hp;
    enemy.x = canvas.width - 50;
    player.hp = Math.min(player.maxHp, player.hp + 35);
  }
  if (player.hp <= 0) {
    player.hp = player.maxHp;
    stage = 1;
    document.getElementById("stage-badge").innerText = "STAGE 1";
  }

  // Health Bars
  document.getElementById("p-bar").style.width = Math.max(0, (player.hp / player.maxHp) * 100) + "%";
  document.getElementById("e-bar").style.width = Math.max(0, (enemy.hp / enemy.maxHp) * 100) + "%";
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Arena Floor
  ctx.fillStyle = "#161925";
  ctx.fillRect(0, floorY(), canvas.width, canvas.height - floorY());
  ctx.strokeStyle = "#2e344d";
  ctx.strokeRect(0, floorY(), canvas.width, 2);

  // Fighters
  drawHumanoid(player, "#00f2fe", false);
  drawHumanoid(enemy, "#ff0844", true);

  // Blasts
  projectiles.forEach(p => {
    ctx.save();
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  // Sparks
  particles.forEach(pt => {
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x, pt.y, 3, 3);
  });
}

function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Maut360</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; user-select: none; }
    body {
      background: #0a0a14;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      overflow: hidden;
      padding: 10px 0;
    }
    #top-hud { width: 92%; max-width: 400px; display: flex; flex-direction: column; gap: 5px; }
    .hud-row { display: flex; justify-content: space-between; font-weight: bold; font-size: 13px; }
    .bars { display: flex; gap: 10px; width: 100%; }
    .bar-wrap { flex: 1; height: 12px; background: #222; border-radius: 6px; overflow: hidden; border: 1px solid #444; }
    .hp-p { height: 100%; width: 100%; background: #00ff88; transition: width 0.1s; }
    .hp-e { height: 100%; width: 100%; background: #ff3366; transition: width 0.1s; }
    .aura-wrap { width: 100%; height: 6px; background: #151828; border-radius: 4px; overflow: hidden; }
    .aura-fill { height: 100%; width: 0%; background: #00d9ff; transition: width 0.1s; }
    canvas {
      background: linear-gradient(180deg, #151828 0%, #251d38 100%);
      border: 2px solid #3d2f66;
      border-radius: 12px;
    }
    #controls { width: 92%; max-width: 400px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 6px; }
    .btn {
      padding: 14px 4px; font-size: 12px; font-weight: bold; border-radius: 8px; border: none; color: #fff; cursor: pointer;
    }
    .btn-punch { background: #e040fb; }
    .btn-kick { background: #ff5252; }
    .btn-aura { background: #00e5ff; color: #000; }
    .btn-ulti { background: #ffd600; color: #000; }
    #modal {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 10;
    }
    #modal button { padding: 10px 24px; background: #00ff88; border: none; font-size: 15px; font-weight: bold; border-radius: 6px; }
  </style>
</head>
<body>
  <div id="top-hud">
    <div class="hud-row">
      <span style="color:#00ff88;">YOU</span>
      <span id="lvl-txt" style="color:#ffd600;">STAGE 1 / 50</span>
      <span style="color:#ff3366;" id="foe-txt">BOSS</span>
    </div>
    <div class="bars">
      <div class="bar-wrap"><div id="p-hp" class="hp-p"></div></div>
      <div class="bar-wrap"><div id="e-hp" class="hp-e"></div></div>
    </div>
    <div class="aura-wrap"><div id="p-aura" class="aura-fill"></div></div>
  </div>

  <canvas id="c" width="340" height="300"></canvas>

  <div id="controls">
    <button class="btn btn-punch" onclick="action('punch')">👊 PUNCH</button>
    <button class="btn btn-kick" onclick="action('kick')">🦵 KICK</button>
    <button class="btn btn-aura" onclick="action('aura')">🔥 AURA</button>
    <button class="btn btn-ulti" onclick="action('ulti')">⚡ ULTI</button>
  </div>

  <div id="modal">
    <h2 id="m-title">STAGE WON!</h2>
    <p id="m-sub"></p>
    <button id="m-btn" onclick="nextStage()">CONTINUE</button>
  </div>
    <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");

    let level = 1, maxLevels = 50, isOver = false;
    let player = { x: 70, y: 210, hp: 100, maxHp: 100, aura: 20, maxAura: 100, anim: 'idle' };
    let enemy = { x: 230, y: 210, hp: 100, maxHp: 100, atk: 6, anim: 'idle' };
    let particles = [], hitText = null;

    function initLevel(lvl) {
      level = lvl;
      document.getElementById("lvl-txt").innerText = `STAGE ${level} / ${maxLevels}`;
      document.getElementById("foe-txt").innerText = `LVL ${level} BOSS`;
      player.hp = player.maxHp;
      player.aura = 20;
      enemy.maxHp = 70 + (level * 16);
      enemy.hp = enemy.maxHp;
      enemy.atk = 5 + Math.floor(level * 1.2);
      updateHud();
      isOver = false;
      document.getElementById("modal").style.display = "none";
    }

    function updateHud() {
      document.getElementById("p-hp").style.width = (Math.max(0, player.hp) / player.maxHp * 100) + "%";
      document.getElementById("e-hp").style.width = (Math.max(0, enemy.hp) / enemy.maxHp * 100) + "%";
      document.getElementById("p-aura").style.width = (player.aura / player.maxAura * 100) + "%";
    }

    function action(type) {
      if (isOver) return;
      if (type === 'punch') {
        player.anim = 'punch';
        let dmg = 12 + Math.floor(Math.random() * 6);
        enemy.hp -= dmg;
        player.aura = Math.min(100, player.aura + 10);
        hitText = { txt: `-${dmg}`, c: '#e040fb', y: enemy.y - 30 };
      } else if (type === 'kick') {
        player.anim = 'kick';
        let dmg = 18 + Math.floor(Math.random() * 8);
        enemy.hp -= dmg;
        player.aura = Math.min(100, player.aura + 14);
        hitText = { txt: `-${dmg}`, c: '#ff5252', y: enemy.y - 30 };
      } else if (type === 'aura') {
        player.anim = 'aura';
        player.aura = Math.min(100, player.aura + 30);
        hitText = { txt: '+AURA', c: '#00e5ff', y: player.y - 30 };
      } else if (type === 'ulti') {
        if (player.aura >= 60) {
          player.aura -= 60;
          player.anim = 'punch';
          let dmg = 45 + Math.floor(Math.random() * 20);
          enemy.hp -= dmg;
          hitText = { txt: `💥 CRIT -${dmg}`, c: '#ffd600', y: enemy.y - 40 };
        } else {
          hitText = { txt: 'NEED AURA!', c: '#ff0055', y: player.y - 30 };
        }
      }
      updateHud();
      checkWin();
      setTimeout(() => player.anim = 'idle', 200);
    }

    setInterval(() => {
      if (isOver) return;
      if (Math.random() < 0.6) {
        enemy.anim = 'atk';
        let dmg = enemy.atk + Math.floor(Math.random() * 4);
        player.hp -= dmg;
        hitText = { txt: `-${dmg}`, c: '#ff3366', y: player.y - 30 };
        updateHud();
        checkWin();
        setTimeout(() => enemy.anim = 'idle', 250);
      }
    }, 1300);

    function checkWin() {
      if (enemy.hp <= 0) {
        isOver = true;
        showModal(level >= maxLevels ? "🏆 CHAMPION!" : `STAGE ${level} CLEARED!`, "NEXT STAGE", () => initLevel(level + 1));
      } else if (player.hp <= 0) {
        isOver = true;
        showModal("💀 MAUT HO GAYI!", "RETRY", () => initLevel(level));
      }
    }

    function showModal(title, btnText, cb) {
      document.getElementById("m-title").innerText = title;
      const b = document.getElementById("m-btn");
      b.innerText = btnText;
      b.onclick = cb;
      document.getElementById("modal").style.display = "flex";
    }

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#1e1e30";
      ctx.fillRect(0, 240, canvas.width, 60);

      // Player
      ctx.save();
      ctx.translate(player.x, player.y);
      if (player.anim === 'aura') {
        ctx.beginPath();
        ctx.arc(0, -20, 32, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(0, 229, 255, 0.3)";
        ctx.fill();
      }
      ctx.fillStyle = "#00e5ff";
      ctx.fillRect(-10, -35, 20, 35);
      ctx.beginPath();
      ctx.arc(0, -45, 10, 0, Math.PI * 2);
      ctx.fillStyle = "#fff";
      ctx.fill();
      if (player.anim === 'punch') { ctx.strokeStyle="#00e5ff"; ctx.lineWidth=4; ctx.strokeRect(10, -28, 16, 5); }
      if (player.anim === 'kick') { ctx.strokeStyle="#00e5ff"; ctx.lineWidth=4; ctx.strokeRect(8, -10, 18, 5); }
      ctx.restore();

      // Enemy
      ctx.save();
      ctx.translate(enemy.x, enemy.y);
      ctx.fillStyle = "#ff3366";
      ctx.fillRect(-12, -40, 24, 40);
      ctx.beginPath();
      ctx.arc(0, -50, 11, 0, Math.PI * 2);
      ctx.fillStyle = "#ff809b";
      ctx.fill();
      if (enemy.anim === 'atk') { ctx.strokeStyle="#ff3366"; ctx.lineWidth=4; ctx.strokeRect(-22, -30, 14, 5); }
      ctx.restore();

      // Hit Text
      if (hitText) {
        ctx.font = "bold 16px sans-serif";
        ctx.fillStyle = hitText.c;
        ctx.fillText(hitText.txt, 140, hitText.y);
        hitText.y -= 0.8;
      }
      requestAnimationFrame(loop);
    }

    initLevel(1);
    loop();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MAUT 360 Combat Arena</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0b0e14; color: #fff; font-family: sans-serif; overflow: hidden; touch-action: none; }
  #hud {
    position: absolute; top: 0; left: 0; width: 100vw; height: 75px;
    background: #11151f; border-bottom: 2px solid #202738;
    display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; z-index: 10;
  }
  .info { width: 38%; }
  .name { font-size: 13px; font-weight: 800; margin-bottom: 5px; }
  .bar-bg { width: 100%; height: 16px; background: #222736; border-radius: 8px; overflow: hidden; border: 1.5px solid #333d54; }
  .fill { height: 100%; width: 100%; transition: width 0.15s ease-out; }
  #p-bar { background: linear-gradient(90deg, #00c6ff, #0072ff); }
  #e-bar { background: linear-gradient(90deg, #ff416c, #ff4b2b); }
  #mode-badge { font-size: 14px; font-weight: 900; color: #f1c40f; text-align: center; }
  #gameCanvas { display: block; width: 100vw; height: calc(100vh - 225px); margin-top: 75px; background: #161b26; }
  #controls {
    position: absolute; bottom: 0; left: 0; width: 100vw; height: 150px;
    background: #0d1118; border-top: 2px solid #202738;
    display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; z-index: 10;
  }
  .btns { display: flex; gap: 10px; }
  .btn {
    width: 62px; height: 62px; border-radius: 14px; font-size: 22px; font-weight: 900;
    background: #1c2230; color: #fff; border: 2px solid #2f384d;
    display: flex; align-items: center; justify-content: center;
  }
  .btn:active { transform: scale(0.92); background: #2f384d; }
  .btn-atk { border-color: #ff4757; color: #ff6b81; }
  #overlay {
    position: absolute; inset: 0; background: rgba(5, 7, 12, 0.9);
    display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 20;
  }
</style>
</head>
<body>
  <div id="hud">
    <div class="info">
      <div class="name" id="p1-name" style="color: #00c6ff;">PLAYER 1</div>
      <div class="bar-bg"><div id="p-bar" class="fill"></div></div>
    </div>
    <div id="mode-badge">ARENA</div>
    <div class="info" style="text-align: right;">
      <div class="name" id="p2-name" style="color: #ff4757;">PLAYER 2</div>
      <div class="bar-bg"><div id="e-bar" class="fill"></div></div>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div id="controls">
    <div class="btns">
      <button class="btn" id="b-left">◀</button>
      <button class="btn" id="b-right">▶</button>
      <button class="btn" id="b-jump">⬆</button>
    </div>
    <div class="btns">
      <button class="btn btn-atk" id="b-punch">👊</button>
      <button class="btn btn-atk" id="b-kick">🦵</button>
    </div>
  </div>

  <div id="overlay">
    <h1 id="res-title" style="font-size:32px; font-weight:900;">MATCH OVER</h1>
    <p id="res-sub" style="color:#aaa; margin: 15px 0 25px;"></p>
    <button onclick="location.reload()" style="padding:12px 24px; font-weight:bold; border-radius:10px; background:#0072ff; color:#fff; border:none;">REMATCH</button>
  </div>

<script>
const params = new URLSearchParams(window.location.search);
const room = params.get('room');
const myRole = params.get('role') || 'p1';
const isPvP = !!room;

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight - 225; }
window.addEventListener("resize", resize);
resize();

const floorY = () => canvas.height - 35;
let gameOver = false;
let p1 = { x: 70, y: 100, vx: 0, vy: 0, hp: 100, act: "idle", face: 1 };
let p2 = { x: canvas.width - 90, y: 100, vx: 0, vy: 0, hp: 100, act: "idle", face: -1 };

if (isPvP) {
  document.getElementById("mode-badge").innerText = `ROOM: ${room}`;
  document.getElementById("p1-name").innerText = myRole === 'p1' ? "YOU (P1)" : "OPPONENT (P1)";
  document.getElementById("p2-name").innerText = myRole === 'p2' ? "YOU (P2)" : "OPPONENT (P2)";
}

function bind(id, fn) {
  const el = document.getElementById(id);
  el.addEventListener("touchstart", (e) => { e.preventDefault(); fn(); });
  el.addEventListener("mousedown", (e) => { e.preventDefault(); fn(); });
}

bind("b-left", () => act("move_left"));
bind("b-right", () => act("move_right"));
bind("b-jump", () => act("jump"));
bind("b-punch", () => act("punch"));
bind("b-kick", () => act("kick"));

function act(action) {
  if (gameOver) return;
  const me = myRole === 'p1' ? p1 : p2;
  if (action === "move_left") me.x = Math.max(30, me.x - 20);
  if (action === "move_right") me.x = Math.min(canvas.width - 50, me.x + 20);
  if (action === "jump" && me.y >= floorY() - 70) me.vy = -14;
  if (action === "punch" || action === "kick") {
    me.act = action;
    setTimeout(() => me.act = "idle", 300);
  }

  if (isPvP) {
    fetch('/api/room/action', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ room, role: myRole, action })
    });
  } else {
    // Solo vs Bot
    if (action === "punch" || action === "kick") {
      p2.hp = Math.max(0, p2.hp - (action === "punch" ? 15 : 22));
    }
  }
}

// Multiplayer sync polling
if (isPvP) {
  setInterval(async () => {
    if (gameOver) return;
    try {
      const res = await fetch(`/api/room/state?room=${room}`);
      const data = await res.json();
      if (data && data.p1_hp !== undefined) {
        p1.hp = data.p1_hp;
        p2.hp = data.p2_hp;
        if (myRole === 'p1') p2.act = data.p2_last_act;
        if (myRole === 'p2') p1.act = data.p1_last_act;
      }
    } catch(e){}
  }, 300);
}

function drawWarrior(obj, color, isP2) {
  ctx.save();
  ctx.translate(obj.x, obj.y);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(0, 10, 11, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = isP2 ? "#8a1928" : "#124b7a";
  ctx.fillRect(-10, 22, 20, 26);
  ctx.strokeStyle = color;
  ctx.lineWidth = 5; ctx.lineCap = "round";
  ctx.beginPath();
  if (obj.act === "punch") {
    ctx.moveTo(0, 26); ctx.lineTo((isP2 ? -1 : 1) * 26, 26);
  } else {
    ctx.moveTo(0, 26); ctx.lineTo((isP2 ? -1 : 1) * 10, 34);
  }
  ctx.stroke();
  ctx.beginPath();
  if (obj.act === "kick") {
    ctx.moveTo(0, 48); ctx.lineTo((isP2 ? -1 : 1) * 28, 42);
    ctx.moveTo(0, 48); ctx.lineTo(-4, 65);
  } else {
    ctx.moveTo(-5, 48); ctx.lineTo(-6, 65);
    ctx.moveTo(5, 48); ctx.lineTo(6, 65);
  }
  ctx.stroke();
  ctx.restore();
}

function loop() {
  p1.vy += 0.7; p1.y += p1.vy;
  if (p1.y + 65 >= floorY()) { p1.y = floorY() - 65; p1.vy = 0; }

  p2.vy += 0.7; p2.y += p2.vy;
  if (p2.y + 65 >= floorY()) { p2.y = floorY() - 65; p2.vy = 0; }

  // Bot AI if solo
  if (!isPvP && !gameOver) {
    if (Math.abs(p1.x - p2.x) > 60) p2.x += (p1.x > p2.x ? 1.5 : -1.5);
    else if (Math.random() < 0.03) {
      p2.act = "punch";
      p1.hp = Math.max(0, p1.hp - 10);
      setTimeout(() => p2.act = "idle", 300);
    }
  }

  document.getElementById("p-bar").style.width = p1.hp + "%";
  document.getElementById("e-bar").style.width = p2.hp + "%";

  if (!gameOver && (p1.hp <= 0 || p2.hp <= 0)) {
    gameOver = true;
    const over = document.getElementById("overlay");
    const title = document.getElementById("res-title");
    over.style.display = "flex";
    if (p1.hp <= 0) {
      title.innerText = "PLAYER 2 WINS! 🏆";
      title.style.color = "#ff416c";
    } else {
      title.innerText = "PLAYER 1 WINS! 🏆";
      title.style.color = "#00c6ff";
    }
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#1e2433";
  ctx.fillRect(0, floorY(), canvas.width, canvas.height - floorY());
  drawWarrior(p1, "#00c6ff", false);
  drawWarrior(p2, "#ff416c", true);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
